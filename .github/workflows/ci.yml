name: CI

on:
  push:
    branches: [main, review-fix]
  pull_request:
    branches: [main, review-fix]

jobs:
  validate:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build packages
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Validate External Consumer from Packed Tarballs
        run: node scripts/verify-tarballs.mjs

  nextjs:
    name: Next.js ${{ matrix.next }} consumer (packed tarballs)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ['14', '15', '16']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Build and run a real Next.js ${{ matrix.next }} app from the packed tarballs
        run: NEXT_VERSION=${{ matrix.next }} node scripts/verify-nextjs.mjs
